const sb=window.supabase.createClient("https://wcbmyrtpmrwstbmkeqjt.supabase.co","sb_publishable_9N-bP0PF2xxO2XNFKy-rhQ_5e8cT3tN",{auth:{persistSession:false,autoRefreshToken:true,detectSessionInUrl:false}});
window.YardAccountAuth=sb.auth;
const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const REMEMBER="live-trailer-board-remembered-session-v1",TAB="live-trailer-board-tab-session-v1";let user=null,admin=false,docks=[],editing=null,channel=null,reloadTimer=null,loadingVersion=0,saving=false;
const groupManager=window.createDockGroupManager(sb,()=>docks,()=>admin);$("grouping").onclick=()=>groupManager.open();
function remember(session){if(!session)return;const snap={access_token:session.access_token,refresh_token:session.refresh_token};try{const storage=localStorage.getItem(REMEMBER)?localStorage:sessionStorage,key=storage===localStorage?REMEMBER:TAB;storage.setItem(key,JSON.stringify(snap))}catch{}}
const tableSort=window.createTableSort($("dockRows").closest("table"),(d,key)=>key==="building"?[d.building,dockPosition(d.building,d.dock_number)]:key==="dock_number"?dockPosition(d.building,d.dock_number):key==="visibility"?(d.is_hidden?"Hidden":"Visible"):key==="status"?(d.status==="Open Dock"?"Open":d.status):d[key],()=>render(),"building");
function render(){const term=$("search").value.trim().toLowerCase(),building=$("buildingFilter").value,filtered=docks.filter(d=>(!building||String(d.building)===building)&&[d.building,dockNumber(d.dock_number,d.building),d.side,d.status,d.trailer_number,d.notes].join(" ").toLowerCase().includes(term));$("counts").textContent=filtered.length+" of "+docks.length+" docks";$("dockRows").innerHTML=filtered.length?tableSort.sort(filtered).map(d=>'<tr><td>'+d.building+'</td><td class="number">'+dockNumber(d.dock_number,d.building)+'</td><td>'+esc(d.side)+'</td><td>'+esc(d.status==='Open Dock'?'Open':d.status)+'</td><td class="number">'+esc(d.trailer_number||'—')+'</td><td>'+ (d.is_hidden?'Hidden':'Visible')+'</td><td class="notes">'+esc(d.notes||'')+'</td><td><button data-edit="'+d.id+'" type="button">Edit</button></td></tr>').join(""):'<tr><td colspan="8" class="muted">No docks found.</td></tr>'}
async function access(){const r=await sb.rpc("get_dock_access");if(r.error)throw r.error;$("userLabel").dataset.accountRole=r.data?.role||"";$("dockRoleLabel").textContent=r.data?.role||"";admin=["Owner","Admin"].includes(r.data?.role);$("dockPanel").hidden=!admin;if(!admin){groupManager.close();$("editor").close();$("pageMessage").textContent="Admins can manage docks. Return to the Live Trailer Board.";if(channel){await sb.removeChannel(channel);channel=null}}return admin}
async function load(){if(!admin)return;const version=++loadingVersion;const r=await sb.from("docks").select("*").order("building").order("side").order("dock_number");if(version!==loadingVersion)return;if(r.error)throw r.error;docks=r.data||[];render();$("pageMessage").textContent=""}
function queueLoad(){clearTimeout(reloadTimer);reloadTimer=setTimeout(()=>load().catch(e=>$("pageMessage").textContent=e.message),120)}
async function initialize(u){user=u;$("userLabel").dataset.accountEmail=u.email||"";$("userLabel").textContent=(u.email||"").split("@")[0];$("signOut").hidden=false;$("loginPanel").hidden=true;if(!await access())return;await load();window.DockVoice?.connect(sb,u.id);if(channel)await sb.removeChannel(channel);channel=sb.channel("dock-management-live").on("postgres_changes",{event:"*",schema:"public",table:"docks"},queueLoad).subscribe(status=>{const badge=$("connectionBadge");badge.textContent=status==="SUBSCRIBED"?"Live":status==="CHANNEL_ERROR"||status==="TIMED_OUT"?"Connection issue":"Connecting…";badge.className="connection-badge "+(status==="SUBSCRIBED"?"live":status==="CHANNEL_ERROR"||status==="TIMED_OUT"?"offline":"")})}
function edit(d){if(!admin||!d)return;editing=d;$("editorTitle").textContent="Building "+d.building+" · Dock "+dockNumber(d.dock_number,d.building);$("dockInfo").textContent=d.side+" · "+d.status+(d.trailer_number?" · "+d.trailer_number:"");$("notes").value=d.notes||"";$("isHidden").checked=Boolean(d.is_hidden);$("editorMessage").textContent="";$("editor").showModal();$("notes").focus()}
$("closeEditor").onclick=$("cancelEditor").onclick=()=>{if(!saving)$("editor").close()};$("editor").addEventListener("cancel",e=>{if(saving)e.preventDefault()});$("search").oninput=render;$("buildingFilter").onchange=render;$("refresh").onclick=()=>load().catch(e=>$("pageMessage").textContent=e.message);
$("dockForm").onsubmit=async e=>{e.preventDefault();if(!admin||saving||!editing)return;saving=true;$("saveDock").disabled=true;$("editorMessage").textContent="Saving…";try{const r=await sb.rpc("save_dock_details",{p_id:editing.id,p_notes:$("notes").value,p_is_hidden:$("isHidden").checked,p_expected_updated_at:editing.updated_at});if(r.error)throw r.error;$("editor").close();await load()}catch(err){$("editorMessage").textContent=err.message}finally{saving=false;$("saveDock").disabled=false}};
$("dockRows").onclick=e=>{const button=e.target.closest("[data-edit]");if(button)edit(docks.find(d=>d.id===button.dataset.edit))};
$("loginForm").onsubmit=async e=>{e.preventDefault();$("loginMessage").textContent="Signing in…";try{const r=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(r.error)throw r.error;remember(r.data.session);await initialize(r.data.user)}catch(err){$("loginMessage").textContent=err.message}};
$("signOut").onclick=async()=>{await sb.auth.signOut();try{localStorage.removeItem(REMEMBER);sessionStorage.removeItem(TAB)}catch{}location.href="index.html"};
$("themeToggle").onclick=()=>{const theme=document.documentElement.dataset.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=theme;try{localStorage.setItem("live-trailer-board-theme-v1",theme)}catch{}};
sb.auth.onAuthStateChange((event,session)=>{if(session)remember(session);if(event==="SIGNED_OUT"){window.DockVoice?.disconnect();admin=false;user=null;groupManager.close();$("dockPanel").hidden=true;$("editor").close();$("loginPanel").hidden=false;$("pageMessage").textContent="Sign in to manage docks."}});
setInterval(()=>{if(user&&!document.hidden)access().catch(e=>$("pageMessage").textContent=e.message)},30000);
(async()=>{try{let saved=null;try{saved=JSON.parse(localStorage.getItem(REMEMBER)||sessionStorage.getItem(TAB)||"null")}catch{}if(saved){const r=await sb.auth.setSession(saved);if(r.error)throw r.error;if(r.data.session?.user){remember(r.data.session);await initialize(r.data.session.user);return}}$("loginPanel").hidden=false;$("pageMessage").textContent="Sign in to manage docks."}catch(err){$("loginPanel").hidden=false;$("pageMessage").textContent=err.message}})();
</script></body></html>
