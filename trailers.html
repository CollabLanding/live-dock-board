function render(){const term=$("search").value.trim().toLowerCase(),filtered=trailers.filter(t=>[t.number,t.category,t.location_label,t.notes].join(" ").toLowerCase().includes(term));$("counts").textContent=trailers.length+" trailers · "+trailers.filter(t=>t.category==="Active").length+" active · "+trailers.filter(t=>t.category==="Storage").length+" storage";$("trailerRows").innerHTML=filtered.length?tableSort.sort(filtered).map(t=>{const d=docks.find(d=>d.trailer_number===t.number);return '<tr><td class="number">'+esc(t.number)+'</td><td>'+esc(t.category)+'</td><td>'+esc(t.location_label)+'</td><td class="dock"><i class="status-dot'+(d?' assigned':'')+'"></i>'+(d?'Building '+d.building+' · Dock '+dockNumber(d.dock_number,d.building):'Unassigned')+'</td><td class="notes">'+esc(t.notes)+'</td><td><div class="actions"><button data-edit="'+t.id+'" type="button">Edit</button><button data-remove="'+t.id+'" class="danger" type="button">Remove</button></div></td></tr>'}).join(""):'<tr><td colspan="6" class="muted">No trailers found.</td></tr>'}
async function access(){const r=await sb.rpc("get_dock_access");if(r.error)throw r.error;$("userLabel").dataset.accountRole=r.data?.role||"";$("dockRoleLabel").textContent=r.data?.role||"";admin=["Owner","Admin"].includes(r.data?.role);$("trailerPanel").hidden=!admin;if(!admin){$("editor").close();$("pageMessage").textContent="Admins can manage trailers. Return to the Live Trailer Board.";if(channel){await sb.removeChannel(channel);channel=null}}return admin}
async function load(){if(!admin)return;const version=++loadingVersion;const [t,d]=await Promise.all([sb.from("trailers").select("*").order("number"),sb.from("docks").select("building,dock_number,trailer_number")]);if(version!==loadingVersion)return;if(t.error||d.error)throw t.error||d.error;trailers=t.data||[];docks=d.data||[];render();$("pageMessage").textContent=""}
function queueLoad(){clearTimeout(reloadTimer);reloadTimer=setTimeout(()=>load().catch(e=>$("pageMessage").textContent=e.message),120)}
async function initialize(u){user=u;$("userLabel").dataset.accountEmail=u.email||"";$("userLabel").textContent=(u.email||"").split("@")[0];$("signOut").hidden=false;$("loginPanel").hidden=true;if(!await access())return;await load();window.DockVoice?.connect(sb,u.id);if(channel)await sb.removeChannel(channel);channel=sb.channel("trailer-management-live").on("postgres_changes",{event:"*",schema:"public",table:"trailers"},queueLoad).on("postgres_changes",{event:"*",schema:"public",table:"docks"},queueLoad).subscribe(status=>{const badge=$("connectionBadge");badge.textContent=status==="SUBSCRIBED"?"Live":status==="CHANNEL_ERROR"||status==="TIMED_OUT"?"Connection issue":"";badge.className="connection-badge "+(status==="SUBSCRIBED"?"live":status==="CHANNEL_ERROR"||status==="TIMED_OUT"?"offline":"")})}
function edit(t=null){if(!admin)return;editing=t;$("editorTitle").textContent=t?"Edit Trailer":"Add Trailer";$("number").value=t?.number||"";$("category").value=t?.category||"Active";$("locationLabel").value=t?.location_label||"";$("notes").value=t?.notes||"";$("editorMessage").textContent="";$("editor").showModal();$("number").focus()}
$("addTrailer").onclick=()=>edit();$("closeEditor").onclick=$("cancelEditor").onclick=()=>{if(!saving)$("editor").close()};$("editor").addEventListener("cancel",e=>{if(saving)e.preventDefault()});$("search").oninput=render;$("refresh").onclick=()=>load().catch(e=>$("pageMessage").textContent=e.message);
$("trailerForm").onsubmit=async e=>{e.preventDefault();if(!admin||saving)return;saving=true;$("saveTrailer").disabled=true;$("editorMessage").textContent="Saving…";try{const r=await sb.rpc("save_trailer",{p_id:editing?.id||null,p_number:$("number").value,p_category:$("category").value,p_location_label:$("locationLabel").value,p_notes:$("notes").value,p_expected_updated_at:editing?.updated_at||null});if(r.error)throw r.error;$("editor").close();await load()}catch(err){$("editorMessage").textContent=err.message}finally{saving=false;$("saveTrailer").disabled=false}};
$("trailerRows").onclick=async e=>{const editButton=e.target.closest("[data-edit]"),removeButton=e.target.closest("[data-remove]");if(editButton){edit(trailers.find(t=>t.id===editButton.dataset.edit));return}if(!removeButton||!admin)return;const t=trailers.find(t=>t.id===removeButton.dataset.remove);if(!t)return;const assigned=docks.some(d=>d.trailer_number===t.number);if(!confirm("Remove "+t.number+"?"+(assigned?" Its dock assignment will be released.":"")))return;removeButton.disabled=true;try{const r=await sb.rpc("remove_trailer",{p_id:t.id,p_expected_updated_at:t.updated_at});if(r.error)throw r.error;await load()}catch(err){$("pageMessage").textContent=err.message;removeButton.disabled=false}};
$("loginForm").onsubmit=async e=>{e.preventDefault();$("loginMessage").textContent="Signing in…";try{const r=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(r.error)throw r.error;remember(r.data.session);await initialize(r.data.user)}catch(err){$("loginMessage").textContent=err.message}};
$("signOut").onclick=async()=>{await sb.auth.signOut();try{localStorage.removeItem(REMEMBER);sessionStorage.removeItem(TAB)}catch{}location.href="index.html?v=20261026-below-header-scroll"};
$("themeToggle").onclick=()=>{const theme=document.documentElement.dataset.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=theme;try{localStorage.setItem("live-trailer-board-theme-v1",theme)}catch{}};
sb.auth.onAuthStateChange((event,session)=>{if(session)remember(session);if(event==="SIGNED_OUT"){window.DockVoice?.disconnect();admin=false;user=null;$("trailerPanel").hidden=true;$("editor").close();$("loginPanel").hidden=false;$("pageMessage").textContent="Sign in to manage trailers."}});
setInterval(()=>{if(user&&!document.hidden)access().catch(e=>$("pageMessage").textContent=e.message)},30000);
(async()=>{try{let saved=null;try{saved=JSON.parse(localStorage.getItem(REMEMBER)||sessionStorage.getItem(TAB)||"null")}catch{}if(saved){const r=await sb.auth.setSession(saved);if(r.error)throw r.error;if(r.data.session?.user){remember(r.data.session);await initialize(r.data.session.user);return}}$("loginPanel").hidden=false;$("pageMessage").textContent="Sign in to manage trailers."}catch(err){$("loginPanel").hidden=false;$("pageMessage").textContent=err.message}})();
</script></body></html>
